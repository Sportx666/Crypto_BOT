[supervisord]
nodaemon=true
logfile=/app/logs/supervisord.log
logfile_maxbytes=10MB
logfile_backups=5

[program:xvfb]
command=Xvfb :99 -screen 0 1280x800x24 -nolisten tcp
autorestart=true
priority=1
stdout_logfile=/app/logs/xvfb.log
redirect_stderr=true

[program:fluxbox]
command=fluxbox
environment=DISPLAY=":99",HOME="/root"
autorestart=true
priority=2
startsecs=2
stdout_logfile=/app/logs/fluxbox.log
redirect_stderr=true

[program:x11vnc]
command=x11vnc -display :99 -forever -shared -rfbauth /root/.vnc/passwd -rfbport 5900 -noxdamage
autorestart=true
priority=3
startsecs=2
stdout_logfile=/app/logs/x11vnc.log
redirect_stderr=true

[program:bot]
command=python main.py
directory=/app
environment=DISPLAY=":99",HOME="/root"
autorestart=true
startretries=1000
priority=10
stdout_logfile=/app/logs/supervisor_bot.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=5
redirect_stderr=true
